{% extends "base.html" %}
{% block title %}Settings — RadioTAK{% endblock %}
{% block content %}
<div class="header">
  <div>
    <div class="header-title">Settings</div>
    <div class="header-subtitle">Theme, retention, forwarding rules</div>
  </div>
</div>
{% if message %}<div class="alert alert-ok">{{ message }}</div>{% endif %}
<form method="post" action="/settings" style="max-width:560px">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}"/>
  <div class="section-title">Appearance</div>
  <div class="form-field"><label>Title</label><input name="title" value="{{ cfg.title }}"/></div>
  <div class="form-field"><label>Accent color</label><input name="accent" value="{{ cfg.accent }}"/></div>
  <div class="form-field"><label>Theme</label>
    <select name="theme">
      <option value="dark" {% if cfg.theme=='dark' %}selected{% endif %}>Dark</option>
      <option value="light" {% if cfg.theme=='light' %}selected{% endif %}>Light</option>
    </select>
  </div>

  <div class="section-title">Updates</div>
  <div class="form-field"><label>Git branch channel</label>
    <select name="github_branch">
      <option value="main" {% if cfg.github_branch=='main' %}selected{% endif %}>main (stable)</option>
      <option value="dev" {% if cfg.github_branch=='dev' %}selected{% endif %}>dev</option>
    </select>
  </div>

  <div class="section-title">Retention</div>
  <div class="form-field"><label>Log retention (days)</label><input type="number" name="log_retention_days" value="{{ cfg.log_retention_days }}"/></div>
  <div class="form-field"><label>Observation retention (days)</label><input type="number" name="observation_retention_days" value="{{ cfg.observation_retention_days }}"/></div>
  <div class="form-field"><label>Max log size (MB)</label><input type="number" name="max_log_mb" value="{{ cfg.max_log_mb }}"/></div>
  <div class="form-field"><label><input type="checkbox" name="privacy_mode" value="1" {% if cfg.privacy_mode %}checked{% endif %}/> Privacy mode (hash radio IDs in logs)</label></div>

  <div class="section-title">Forwarding</div>
  <div class="form-field"><label>Min interval (sec)</label><input type="number" name="min_interval_seconds" value="{{ cfg.forwarding.min_interval_seconds }}"/></div>
  <div class="form-field"><label>Stale seconds</label><input type="number" name="stale_seconds" value="{{ cfg.forwarding.stale_seconds }}"/></div>
  <div class="form-field"><label>Min movement (m)</label><input type="number" name="min_movement_meters" value="{{ cfg.forwarding.min_movement_meters }}"/></div>
  <div class="form-field"><label>Stationary heartbeat (sec)</label><input type="number" name="stationary_heartbeat_seconds" value="{{ cfg.forwarding.stationary_heartbeat_seconds }}"/></div>

  <div class="section-title">Password</div>
  <div class="form-field"><label>Current password</label><input type="password" name="current_password" autocomplete="current-password"/></div>
  <div class="form-field"><label>New password</label><input type="password" name="new_password" autocomplete="new-password"/></div>

  <button class="btn btn-primary" type="submit">Save settings</button>
</form>
{% endblock %}
