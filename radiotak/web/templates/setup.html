{% extends "base.html" %}
{% block title %}Setup — RadioTAK{% endblock %}
{% block content %}
<div class="login-wrap" style="margin:-32px;width:calc(100% + 64px)">
  <div class="login-card">
    <h1>First-run setup</h1>
    <p>Create the administrator account for this appliance.</p>
    {% if error %}<div class="alert alert-error">{{ error }}</div>{% endif %}
    <form method="post" action="/setup">
      <div class="form-field">
        <label>Username</label>
        <input type="text" name="username" required autofocus/>
      </div>
      <div class="form-field">
        <label>Password</label>
        <input type="password" name="password" required minlength="8"/>
      </div>
      <div class="form-field">
        <label>Confirm password</label>
        <input type="password" name="password2" required minlength="8"/>
      </div>
      <button class="btn btn-primary" type="submit" style="width:100%">Create admin & continue</button>
    </form>
  </div>
</div>
{% endblock %}
