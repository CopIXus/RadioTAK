name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
      - name: Ruff
        run: ruff check radiotak modules tests
      - name: Pytest
        env:
          RADIOTAK_DATA_DIR: ${{ runner.temp }}/radiotak-data
        run: pytest -q
