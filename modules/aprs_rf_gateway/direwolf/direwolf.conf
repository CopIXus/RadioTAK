# Direwolf RX-only APRS for RadioTAK (Raspberry Pi / Debian).
# Audio is piped from rtl_fm (or ADEVICE if using a sound card) — see
# scripts/start-direwolf-rtl.sh. Do not enable digipeat or IGate here.

ADEVICE stdin null
ACHANNELS 1

CHANNEL 0
MYCALL N0CALL-15
MODEM 1200

# KISS TCP for modules/aprs_rf_gateway
KISSPORT 8001
AGWPORT 8000

# Logging (optional; gateway does not require it)
# LOGDIR /var/lib/radiotak/modules/aprs_rf_gateway/logs
