<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="740" viewBox="0 0 1280 740" role="img" aria-labelledby="title desc">
  <title id="title">RadioTAK clear vs encrypted handling</title>
  <desc id="desc">Clear GPS follows the TAK path. Encrypted traffic is archived with ALGID, KID, system metadata, and optional MI. Matching authorized keys only labels the event; unknown keys are not recovered.</desc>
  <rect width="1280" height="740" fill="#061018"/>
  <text x="64" y="48" fill="#f8fafc" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" font-weight="700">Clear GPS vs encrypted traffic</text>
  <text x="64" y="76" fill="#67e8f9" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15">Same decoder feed. Two destinations. No unknown-key recovery.</text>

  <rect x="48" y="104" width="1184" height="76" rx="12" fill="#122033" stroke="#3b82f6"/>
  <text x="640" y="134" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" letter-spacing="1.5">SDRTRUNK EXPORTER - 127.0.0.1:29500</text>
  <text x="640" y="162" text-anchor="middle" fill="#f8fafc" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="700">sdr2tak.location.v1     |     sdr2tak.decode.v1</text>

  <path d="M640 180 V220" stroke="#38bdf8" stroke-width="3"/>
  <path d="M320 220 H960" stroke="#38bdf8" stroke-width="3"/>
  <path d="M320 220 V258" stroke="#10b981" stroke-width="3"/>
  <path d="M960 220 V258" stroke="#f59e0b" stroke-width="3"/>

  <rect x="72" y="258" width="496" height="430" rx="16" fill="#0d1b16" stroke="#10b981"/>
  <text x="320" y="298" text-anchor="middle" fill="#6ee7b7" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" letter-spacing="1.5">CLEAR / GPS PATH</text>
  <text x="320" y="336" text-anchor="middle" fill="#f8fafc" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="700">Location event</text>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" fill="#cbd5e1" font-size="15">
    <text x="108" y="386">1. Validate lat/lon (reject 0,0)</text>
    <text x="108" y="418">2. Upsert radio identity</text>
    <text x="108" y="450">3. Allowlist check</text>
    <text x="108" y="482">4. Dedupe / rate-limit / stale</text>
    <text x="108" y="514">5. Build CoT XML</text>
    <text x="108" y="546">6. TLS queue to TAK Server</text>
  </g>
  <text x="320" y="600" text-anchor="middle" fill="#6ee7b7" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14">Map marker only for approved units</text>
  <text x="320" y="628" text-anchor="middle" fill="#64748b" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">UID stays stable: RADIOTAK-{sys}-{rid}</text>
  <text x="320" y="656" text-anchor="middle" fill="#64748b" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">Encrypted voice never becomes a position</text>

  <rect x="712" y="258" width="496" height="430" rx="16" fill="#1a1408" stroke="#f59e0b"/>
  <text x="960" y="298" text-anchor="middle" fill="#fbbf24" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" letter-spacing="1.5">ENCRYPTED PATH</text>
  <text x="960" y="336" text-anchor="middle" fill="#f8fafc" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="700">Decode event</text>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" fill="#cbd5e1" font-size="15">
    <text x="748" y="386">1. Capture ALGID / KID / MI*</text>
    <text x="748" y="418">2. System / site / NAC / WACN / RFSS</text>
    <text x="748" y="450">3. Slot, channel, uplink, statuses</text>
    <text x="748" y="482">4. Match authorized TEK on file</text>
    <text x="748" y="514">5. Set decrypt_state + archive SQL</text>
    <text x="748" y="546">6. Live Events + Units badge</text>
  </g>
  <text x="960" y="600" text-anchor="middle" fill="#fbbf24" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14">* MI stored only if the decoder exposed it</text>
  <text x="960" y="628" text-anchor="middle" fill="#64748b" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">Unknown keys are never searched or tested</text>
  <text x="960" y="656" text-anchor="middle" fill="#64748b" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">Raw sample / IQ capture stays off by default</text>
</svg>
