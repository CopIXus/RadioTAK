<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">How RadioTAK pushes Cursor-on-Target to TAK</title>
  <desc id="desc">Allowlisted GPS becomes a CoT event with a stable UID, then is queued per TAK server over TLS. Encrypted metadata never enters this queue.</desc>
  <rect width="1280" height="640" fill="#070f1a"/>
  <text x="64" y="46" fill="#f8fafc" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" font-weight="700">TAK push</text>
  <text x="64" y="74" fill="#38bdf8" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15">Stable UID - per-server marker style - TLS CoT port</text>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="48" y="108" width="220" height="140" rx="12" fill="#111827" stroke="#3b82f6"/>
    <text x="158" y="148" text-anchor="middle" fill="#94a3b8" font-size="11" letter-spacing="1.4">IDENTITY</text>
    <text x="158" y="182" text-anchor="middle" fill="#f8fafc" font-size="16" font-weight="700">Radio RID</text>
    <text x="158" y="206" text-anchor="middle" fill="#67e8f9" font-size="12">forward_to_tak?</text>
    <text x="158" y="226" text-anchor="middle" fill="#64748b" font-size="11">deny unknown default</text>

    <rect x="308" y="108" width="236" height="140" rx="12" fill="#111827" stroke="#06b6d4"/>
    <text x="426" y="148" text-anchor="middle" fill="#94a3b8" font-size="11" letter-spacing="1.4">NORMALIZE</text>
    <text x="426" y="182" text-anchor="middle" fill="#f8fafc" font-size="16" font-weight="700">lat / lon / time</text>
    <text x="426" y="206" text-anchor="middle" fill="#67e8f9" font-size="12">heading / speed / CE</text>
    <text x="426" y="226" text-anchor="middle" fill="#64748b" font-size="11">drop 0,0 and stale dupes</text>

    <rect x="584" y="108" width="268" height="140" rx="12" fill="#111827" stroke="#f59e0b"/>
    <text x="718" y="148" text-anchor="middle" fill="#94a3b8" font-size="11" letter-spacing="1.4">COT EVENT</text>
    <text x="718" y="182" text-anchor="middle" fill="#f8fafc" font-size="16" font-weight="700">RADIOTAK-{sys}-{rid}</text>
    <text x="718" y="206" text-anchor="middle" fill="#fbbf24" font-size="12">type a-n-G / how m-g</text>
    <text x="718" y="226" text-anchor="middle" fill="#64748b" font-size="11">stale, color, callsign</text>

    <rect x="892" y="108" width="340" height="140" rx="12" fill="#111827" stroke="#10b981"/>
    <text x="1062" y="148" text-anchor="middle" fill="#94a3b8" font-size="11" letter-spacing="1.4">TAK SERVER</text>
    <text x="1062" y="182" text-anchor="middle" fill="#f8fafc" font-size="16" font-weight="700">PyTAK TLS client</text>
    <text x="1062" y="206" text-anchor="middle" fill="#6ee7b7" font-size="12">enrolled cert - CoT 8089</text>
    <text x="1062" y="226" text-anchor="middle" fill="#64748b" font-size="11">Marti channels optional</text>
  </g>
  <g fill="none" stroke="#22d3ee" stroke-width="3">
    <path d="M268 178 H308"/>
    <path d="M544 178 H584"/>
    <path d="M852 178 H892"/>
  </g>

  <rect x="48" y="280" width="1184" height="316" rx="14" fill="#0c1624" stroke="#1e3a5f"/>
  <text x="72" y="318" fill="#94a3b8" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" letter-spacing="1.5">WHAT IS SENT - AND WHAT IS NOT</text>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16">
    <text x="72" y="360" fill="#e2e8f0">On the wire: CoT point with lat/lon, callsign, team/role, stale time, and a stable UID so TAK updates one marker.</text>
    <text x="72" y="396" fill="#e2e8f0">Operator controls: Units approve a radio; Settings deny unknown radios; TAK page sets marker style and enrollment.</text>
    <text x="72" y="432" fill="#67e8f9">Not sent: encrypted call audio, ALGID/KID archive rows, traffic keys, or unapproved radio IDs.</text>
    <text x="72" y="476" fill="#94a3b8" font-size="14">Queue is per TAK server. A radio approved for forwarding can appear on multiple servers with different colors or callsigns.</text>
    <text x="72" y="508" fill="#94a3b8" font-size="14">If GPS later arrives for an encrypted radio that is allowlisted, only the location event is converted to CoT.</text>
    <text x="72" y="548" fill="#64748b" font-size="13">Function of the appliance: policy-filtered GPS to TAK, not a copy of any live console.</text>
  </g>
</svg>
