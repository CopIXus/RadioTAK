<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 620" role="img" aria-labelledby="title desc">
  <title id="title">RadioTAK pipeline: RF decode to TAK CoT</title>
  <desc id="desc">SDR hardware feeds SDRTrunk. RadioTAK normalizes events, allowlists radios, archives encryption metadata, and forwards approved GPS as Cursor-on-Target to TAK Server.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07101c"/>
      <stop offset="100%" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#132033"/>
      <stop offset="100%" stop-color="#0e1726"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="620" fill="url(#bg)"/>
  <g opacity="0.16" stroke="#1e3a5f" stroke-width="1">
    <path d="M0 80 H1280 M0 160 H1280 M0 240 H1280 M0 320 H1280 M0 400 H1280 M0 480 H1280 M0 560 H1280"/>
    <path d="M80 0 V620 M160 0 V620 M240 0 V620 M320 0 V620 M400 0 V620 M480 0 V620 M560 0 V620 M640 0 V620 M720 0 V620 M800 0 V620 M880 0 V620 M960 0 V620 M1040 0 V620 M1120 0 V620 M1200 0 V620"/>
  </g>
  <text x="64" y="48" fill="#e2e8f0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" font-weight="700">RadioTAK data path</text>
  <text x="64" y="76" fill="#7dd3fc" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15">Authorized P25/DMR telemetry - policy filter - Cursor-on-Target - TAK</text>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="48" y="110" width="200" height="168" rx="14" fill="url(#card)" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="148" y="142" text-anchor="middle" fill="#94a3b8" font-size="11" letter-spacing="1.6">RF FRONT END</text>
    <text x="148" y="178" text-anchor="middle" fill="#f8fafc" font-size="20" font-weight="700">SDR</text>
    <text x="148" y="206" text-anchor="middle" fill="#67e8f9" font-size="13">RTL / Airspy</text>
    <text x="148" y="232" text-anchor="middle" fill="#64748b" font-size="12">control channel IQ</text>
    <text x="148" y="254" text-anchor="middle" fill="#64748b" font-size="12">USB passthrough</text>

    <rect x="292" y="110" width="216" height="168" rx="14" fill="url(#card)" stroke="#06b6d4" stroke-width="1.5"/>
    <text x="400" y="142" text-anchor="middle" fill="#94a3b8" font-size="11" letter-spacing="1.6">DECODER</text>
    <text x="400" y="178" text-anchor="middle" fill="#f8fafc" font-size="20" font-weight="700">SDRTrunk</text>
    <text x="400" y="206" text-anchor="middle" fill="#67e8f9" font-size="13">P25 / DMR / LSM</text>
    <text x="400" y="232" text-anchor="middle" fill="#64748b" font-size="12">NDJSON :29500</text>
    <text x="400" y="254" text-anchor="middle" fill="#64748b" font-size="12">spectrum :29501</text>

    <rect x="552" y="96" width="236" height="196" rx="14" fill="url(#card)" stroke="#38bdf8" stroke-width="1.8"/>
    <text x="670" y="128" text-anchor="middle" fill="#94a3b8" font-size="11" letter-spacing="1.6">APPLIANCE</text>
    <text x="670" y="164" text-anchor="middle" fill="#f8fafc" font-size="20" font-weight="700">RadioTAK</text>
    <text x="670" y="196" text-anchor="middle" fill="#67e8f9" font-size="13">normalize identities</text>
    <text x="670" y="218" text-anchor="middle" fill="#67e8f9" font-size="13">allowlist + archive</text>
    <text x="670" y="250" text-anchor="middle" fill="#64748b" font-size="12">HTTPS console :5001</text>
    <text x="670" y="272" text-anchor="middle" fill="#64748b" font-size="12">sdr2tak.location / decode</text>

    <rect x="832" y="110" width="196" height="168" rx="14" fill="url(#card)" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="930" y="142" text-anchor="middle" fill="#94a3b8" font-size="11" letter-spacing="1.6">OUTPUT</text>
    <text x="930" y="178" text-anchor="middle" fill="#f8fafc" font-size="20" font-weight="700">CoT XML</text>
    <text x="930" y="206" text-anchor="middle" fill="#fbbf24" font-size="13">GPS only</text>
    <text x="930" y="232" text-anchor="middle" fill="#64748b" font-size="12">UID / type / stale / CE</text>
    <text x="930" y="254" text-anchor="middle" fill="#64748b" font-size="12">per-server style</text>

    <rect x="1072" y="110" width="160" height="168" rx="14" fill="url(#card)" stroke="#10b981" stroke-width="1.5"/>
    <text x="1152" y="142" text-anchor="middle" fill="#94a3b8" font-size="11" letter-spacing="1.6">CONSUMER</text>
    <text x="1152" y="178" text-anchor="middle" fill="#f8fafc" font-size="20" font-weight="700">TAK</text>
    <text x="1152" y="206" text-anchor="middle" fill="#6ee7b7" font-size="13">TLS 8089</text>
    <text x="1152" y="232" text-anchor="middle" fill="#64748b" font-size="12">ATAK / iTAK</text>
    <text x="1152" y="254" text-anchor="middle" fill="#64748b" font-size="12">WinTAK / server</text>
  </g>

  <g fill="none" stroke="url(#accent)" stroke-width="3" stroke-linecap="round">
    <path d="M248 194 H292"/>
    <path d="M508 194 H552"/>
    <path d="M788 194 H832"/>
    <path d="M1028 194 H1072"/>
  </g>
  <g fill="#06b6d4">
    <polygon points="292,194 278,187 278,201"/>
    <polygon points="552,194 538,187 538,201"/>
    <polygon points="832,194 818,187 818,201"/>
    <polygon points="1072,194 1058,187 1058,201"/>
  </g>

  <rect x="48" y="340" width="1184" height="244" rx="14" fill="#0c1624" stroke="#1e3a5f"/>
  <text x="72" y="376" fill="#94a3b8" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" letter-spacing="1.6">POLICY GATE - WHAT REACHES THE MAP</text>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="72" y="416" fill="#e2e8f0" font-size="16">Approved radio + valid lat/lon = queued CoT to TAK.</text>
    <text x="72" y="448" fill="#94a3b8" font-size="14">Encrypted / heard-only calls stay in Live Events and the encryption archive. They never become fake map points.</text>
    <text x="72" y="492" fill="#67e8f9" font-size="14">Observed radios are catalogued. Forwarding requires an explicit allowlist.</text>
    <text x="72" y="524" fill="#94a3b8" font-size="14">TAK still receives heartbeat / presence from RadioTAK itself when a server is enrolled.</text>
    <text x="72" y="556" fill="#64748b" font-size="13">The map sees RID, GPS, and operator policy - not encrypted voice or cipher metadata.</text>
  </g>
</svg>
