<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 560" role="img" aria-labelledby="title desc">
  <title id="title">RadioTAK pipeline: RF decode to TAK CoT</title>
  <desc id="desc">SDR hardware feeds SDRTrunk. RadioTAK normalizes events, allowlists radios, and forwards GPS as Cursor-on-Target to TAK Server. Encrypted traffic is archived, not mapped.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07101c"/>
      <stop offset="100%" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#132033"/>
      <stop offset="100%" stop-color="#0e1726"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1280" height="560" fill="url(#bg)"/>
  <g opacity="0.18" stroke="#1e3a5f" stroke-width="1">
    <path d="M0 80 H1280 M0 160 H1280 M0 240 H1280 M0 320 H1280 M0 400 H1280 M0 480 H1280"/>
    <path d="M80 0 V560 M160 0 V560 M240 0 V560 M320 0 V560 M400 0 V560 M480 0 V560 M560 0 V560 M640 0 V560 M720 0 V560 M800 0 V560 M880 0 V560 M960 0 V560 M1040 0 V560 M1120 0 V560 M1200 0 V560"/>
  </g>
  <text x="64" y="52" fill="#e2e8f0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" font-weight="700">RadioTAK data path</text>
  <text x="64" y="82" fill="#7dd3fc" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15">Authorized P25/DMR telemetry ’ policy filter ’ Cursor-on-Target ’ TAK</text>

  <!-- nodes -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="48" y="140" width="180" height="150" rx="14" fill="url(#card)" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="138" y="178" text-anchor="middle" fill="#94a3b8" font-size="11" letter-spacing="1.5">RF FRONT END</text>
    <text x="138" y="214" text-anchor="middle" fill="#f8fafc" font-size="18" font-weight="700">SDR</text>
    <text x="138" y="242" text-anchor="middle" fill="#67e8f9" font-size="12">RTL / Airspy</text>
    <text x="138" y="262" text-anchor="middle" fill="#64748b" font-size="11">control channel</text>

    <rect x="292" y="140" width="200" height="150" rx="14" fill="url(#card)" stroke="#06b6d4" stroke-width="1.5"/>
    <text x="392" y="178" text-anchor="middle" fill="#94a3b8" font-size="11" letter-spacing="1.5">DECODER</text>
    <text x="392" y="214" text-anchor="middle" fill="#f8fafc" font-size="18" font-weight="700">SDRTrunk</text>
    <text x="392" y="242" text-anchor="middle" fill="#67e8f9" font-size="12">P25 / DMR</text>
    <text x="392" y="262" text-anchor="middle" fill="#64748b" font-size="11">NDJSON :29500 / :29501</text>

    <rect x="556" y="120" width="220" height="190" rx="14" fill="url(#card)" stroke="#38bdf8" stroke-width="1.8"/>
    <text x="666" y="158" text-anchor="middle" fill="#94a3b8" font-size="11" letter-spacing="1.5">APPLIANCE</text>
    <text x="666" y="194" text-anchor="middle" fill="#f8fafc" font-size="18" font-weight="700">RadioTAK</text>
    <text x="666" y="226" text-anchor="middle" fill="#67e8f9" font-size="12">normalize · identities</text>
    <text x="666" y="248" text-anchor="middle" fill="#67e8f9" font-size="12">allowlist · archive</text>
    <text x="666" y="278" text-anchor="middle" fill="#64748b" font-size="11">HTTPS console :5001</text>

    <rect x="840" y="140" width="180" height="150" rx="14" fill="url(#card)" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="930" y="178" text-anchor="middle" fill="#94a3b8" font-size="11" letter-spacing="1.5">OUTPUT</text>
    <text x="930" y="214" text-anchor="middle" fill="#f8fafc" font-size="18" font-weight="700">CoT XML</text>
    <text x="930" y="242" text-anchor="middle" fill="#fbbf24" font-size="12">GPS only</text>
    <text x="930" y="262" text-anchor="middle" fill="#64748b" font-size="11">stale · CE · UID</text>

    <rect x="1084" y="140" width="148" height="150" rx="14" fill="url(#card)" stroke="#10b981" stroke-width="1.5"/>
    <text x="1158" y="178" text-anchor="middle" fill="#94a3b8" font-size="11" letter-spacing="1.5">CONSUMER</text>
    <text x="1158" y="214" text-anchor="middle" fill="#f8fafc" font-size="18" font-weight="700">TAK</text>
    <text x="1158" y="242" text-anchor="middle" fill="#6ee7b7" font-size="12">TLS 8089</text>
    <text x="1158" y="262" text-anchor="middle" fill="#64748b" font-size="11">ATAK / iTAK</text>
  </g>

  <!-- arrows -->
  <g fill="none" stroke="url(#accent)" stroke-width="3" stroke-linecap="round">
    <path d="M228 215 H292"/>
    <path d="M492 215 H556"/>
    <path d="M776 215 H840"/>
    <path d="M1020 215 H1084"/>
  </g>
  <g fill="#06b6d4">
    <polygon points="292,215 278,208 278,222"/>
    <polygon points="556,215 542,208 542,222"/>
    <polygon points="840,215 826,208 826,222"/>
    <polygon points="1084,215 1070,208 1070,222"/>
  </g>

  <rect x="48" y="380" width="1184" height="128" rx="14" fill="#0c1624" stroke="#1e3a5f"/>
  <text x="72" y="416" fill="#94a3b8" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" letter-spacing="1.6">POLICY GATE  WHAT REACHES THE MAP</text>
  <text x="72" y="452" fill="#e2e8f0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16">Approved radio + valid lat/lon ’ queued CoT to TAK.</text>
  <text x="72" y="480" fill="#94a3b8" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14">Encrypted / heard-only calls stay in Live Events and the encryption archive. They never become fake map points.</text>
</svg>
